[project]
name = "ai-investment-pipeline-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argparse>=1.4.0",
    "bs4>=0.0.2",
    "google-genai>=2.8.0",
    "httpx>=0.28.1",
    "openai>=2.43.0",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "gemini_chat",
    "thesis"
]